name: Build

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Build plugin packages
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: plugin

      - name: Check out kandev SDK contract
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: kdlbs/kandev
          path: kdlbs-kandev
          ref: 2b1d0cf7d1e118dbf7b57ce5243131bb49b9dae4
          sparse-checkout: |
            apps/backend
            apps/packages/plugin-sdk

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Set up Node
        uses: actions/setup-node@48b5538a25ec861adeb13d99927fa3b8c698398f # v5
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@41ff7695022b1956a80690cc190a8b2591ab6cdf # v4
        with:
          run_install: false

      - name: Install UI dependencies
        working-directory: plugin
        run: make ui-install

      - name: Build UI bundle
        working-directory: plugin
        run: make ui

      - name: Build host binary
        working-directory: plugin
        run: make build

      - name: Package and validate all supported platforms
        working-directory: plugin
        run: make verify-package
