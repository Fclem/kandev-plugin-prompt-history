name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tidy, format, vet, and test
    runs-on: ubuntu-latest
    steps:
      # The local SDK replacement in go.mod expects these checkouts to be
      # siblings: plugin/../kdlbs-kandev/apps/backend.
      - name: Check out plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: plugin

      - name: Check out kandev SDK contract
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: kdlbs/kandev
          path: kdlbs-kandev
          ref: 2b1d0cf7d1e118dbf7b57ce5243131bb49b9dae4
          sparse-checkout: |
            apps/backend
            apps/packages/plugin-sdk

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Check module files are tidy
        working-directory: plugin
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        working-directory: plugin
        run: |
          test -z "$(gofmt -l .)" || { echo "gofmt needed:"; gofmt -l .; exit 1; }

      - name: Vet
        working-directory: plugin
        run: make vet

      - name: Test backend
        working-directory: plugin
        run: make test-backend

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: 10
          run_install: false

      - name: Install UI dependencies
        working-directory: plugin
        run: make ui-install

      - name: Typecheck UI
        working-directory: plugin
        run: make typecheck

      - name: Test UI
        working-directory: plugin
        run: make test-ui

      - name: Build UI bundle
        working-directory: plugin
        run: make ui

  base-floor:
    name: Prompt History backend on floor (2b1d0cf7d)
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugin
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: plugin

      - name: Check out declared minimum SDK
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: kdlbs/kandev
          path: kdlbs-kandev
          ref: 2b1d0cf7d1e118dbf7b57ce5243131bb49b9dae4
          sparse-checkout: apps/backend

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: plugin/go.mod
          cache-dependency-path: plugin/go.sum

      - name: Test provider-free generated backend
        working-directory: plugin
        run: go test ./server/...
