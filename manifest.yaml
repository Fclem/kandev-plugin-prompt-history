# kandev plugin manifest — the single declarative contract between this
# plugin and a kandev host. Everything kandev needs to install, spawn, and
# route to this plugin is described here.
#
# `id` MUST match the Go module name in go.mod and the id you pass to
# window.registerKandevPlugin(...) in ui/bundle.js, and it is the prefix of
# every route kandev serves for you (/api/plugins/<id>/...). Keep the three
# in sync when you rename.
id: "kandev-plugin-prompt-history"
api_version: 2
version: "1.4.0"
display_name: "Prompt History"
description: "Task panel listing the active session's user prompts with parity to the shipped core panel."
author: "kandev"
repo_url: "https://github.com/Fclem/kandev-plugin-prompt-history"
categories: ["tools"]

# min_kandev_version is the oldest kandev release this plugin will install
# against. A release host compares it to its own version at install time and
# refuses the package if it is older, so an operator gets a clear error instead
# of a plugin that loads and then fails on a missing API.
#
# 0.95.0 is the first stable release after PR #3588 added the browser
# conversation facade that ui/bundle.js calls through host.conversation. The
# messages capability audit floor is 0.91.1; this plugin needs the facade, so
# the facade release is the binding minimum.
min_kandev_version: "0.95.0"

# runtime.executables maps each supported platform to the binary kandev
# spawns as a gRPC subprocess. `make package` cross-compiles all five;
# `make package-host` builds just the current one. The paths are relative to
# the package root and must match what the Makefile writes into server/.
runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# capabilities gate what the host will do for you. Declare only what you use.
# This plugin reads the active session's conversation through the browser
# facade (api_read messages) and nothing else: the no-op backend needs no
# events, state, secrets, or write access. Reading its own operator config
# (config_schema below) goes through GET /api/plugins/<id>/config, which is not
# a capability-gated route.
capabilities:
  api_read: ["messages"]

# Operator display settings, rendered by the host at Settings > Plugins >
# Prompt History. Every field defaults to the panel's original appearance, so
# an instance whose config was never saved renders exactly as before. The panel
# reads the stored config from GET /api/plugins/<id>/config on mount and falls
# back to these defaults when the read fails; a saved change therefore applies
# the next time the panel mounts (session/task switch or reload). The key names
# and the enum values are mirrored by PANEL_CONFIG_KEYS and the PANEL_*
# constants in ui/src/panel-config.ts, and `go test ./server/...` fails if the
# two sides drift.
#
# Grouping. The host's settings form is a flat list built from each property's
# name, title, description, type, enum, default and `required` — it has no
# section or heading support — so the topics are made two ways: the keys are
# ordered so a topic's settings sit together, and every title starts with its
# topic ("Numbers: …", "Time: …", "Agent prompts: …", "Agent stacks: …"). In
# render order:
#   Numbers        display_1_show_numbers, display_1b_number_style
#   Time           display_2_show_time, display_3_time_format, display_4_show_duration
#   Agent prompts  display_5_agent_prompt_style, display_6_agent_prompt_display
#   Agent stacks   display_7_agent_stack_min, display_8_agent_stack_expand
#
# Order. The form renders `Object.keys(properties)`, and the host hands the
# frontend a JSON object marshalled from a Go map — which sorts keys by byte —
# so the declaration order below is *not* the render order and the key is the
# only ordering lever the manifest has. `display_1b_` sorts between
# `display_1_` and `display_2_` (`_` is below `b`), which is how the second
# Numbers setting joins the first without renaming the keys operators may
# already have stored.
#
# `required` lists the six selectors: an optional enum renders a "Not set"
# choice on the host's form, and no selector has a meaningful unset state, so
# all six are required — each select then always shows the stored value or its
# default and always submits one. The panel still reads an absent or unknown
# value as the default, which covers a hand-edited config and any record
# written before a field existed.
#
# The two "Agent stacks" settings only matter while the agent prompt display is
# `collapse`, but they are always rendered: the form has no conditional
# visibility, so a field cannot be revealed by another field's value. Their
# descriptions say when they apply.
config_schema:
  type: object
  properties:
    display_1_show_numbers:
      type: boolean
      default: true
      title: "Numbers: Show prompt numbers"
      description: "Show the #N ordinal of each prompt."
    display_1b_number_style:
      type: string
      enum: ["inline", "pill"]
      default: "inline"
      title: "Numbers: Style"
      description: "Where the #N ordinal goes: inline, in front of the prompt text, or as a small pill on the top-left corner of the prompt bubble (the same pill the agent stack uses for its count). Only used when Show prompt numbers is on."
    display_2_show_time:
      type: boolean
      default: true
      title: "Time: Show send time"
      description: "Show the send time (clock) at the right edge of each prompt row. Hidden send time and duration together let the prompt text use the full row width."
    display_3_time_format:
      type: string
      enum: ["relative", "absolute"]
      default: "relative"
      title: "Time: Send time format"
      description: "How the send time reads: compact relative (\"5m\"), or the absolute date and time in the host locale (short date and short time). The other form is shown on hover."
    display_4_show_duration:
      type: boolean
      default: true
      title: "Time: Show duration"
      description: "Show the agent work duration (hourglass) at the right edge of each prompt row."
    display_5_agent_prompt_style:
      type: string
      enum: ["default", "soft grey"]
      default: "default"
      title: "Agent prompts: Style"
      description: "The colour of prompts sent by another task's agent: default (the same bubble as other prompts) or soft grey. Independent of how they are displayed."
    display_6_agent_prompt_display:
      type: string
      enum: ["default", "hide", "collapse"]
      default: "default"
      title: "Agent prompts: Display"
      description: "How prompts sent by another task's agent are listed: default (one row each), hide (not shown at all), or collapse (each run of consecutive agent-sent prompts folds into one stacked card)."
    display_7_agent_stack_min:
      type: integer
      enum: [2, 3, 4, 5]
      default: 2
      title: "Agent stacks: Minimum prompts to stack"
      description: "Only used when Agent prompts: Display is collapse: the smallest run of consecutive agent-sent prompts that folds into a stack, from 2 to 5. A shorter run stays as separate rows."
    display_8_agent_stack_expand:
      type: string
      enum: ["hover", "click"]
      default: "hover"
      title: "Agent stacks: Expand on"
      description: "Only used when Agent prompts: Display is collapse: how a stack opens. hover (also on keyboard focus) opens it under the pointer and closes it when the pointer leaves; click opens and closes it only when you click it."
  required:
    - "display_1b_number_style"
    - "display_3_time_format"
    - "display_5_agent_prompt_style"
    - "display_6_agent_prompt_display"
    - "display_7_agent_stack_min"
    - "display_8_agent_stack_expand"

# ui.bundle points at the ES module frontend half, built by ui/build.mjs into
# ui/bundle.js and served by kandev from the extracted package at
# GET /api/plugins/<id>/ui/bundle.js. ui.styles declares the plugin-owned
# stylesheet the bundle depends on; the host's build never sees the bundle, so
# the stylesheet owns every ph-plugin-* class it renders (the row bubble also
# reuses the host's global markdown-body / markdown-body-user classes).
ui:
  bundle: "/ui/bundle.js"
  styles: ["/ui/plugin.css"]
