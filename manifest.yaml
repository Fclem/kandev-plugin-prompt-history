# kandev plugin manifest — the single declarative contract between this
# plugin and a kandev host. Everything kandev needs to install, spawn, and
# route to this plugin is described here.
#
# `id` MUST match the Go module name in go.mod and the id you pass to
# window.registerKandevPlugin(...) in ui/bundle.js, and it is the prefix of
# every route kandev serves for you (/api/plugins/<id>/...). Keep the three
# in sync when you rename.
id: "kandev-plugin-prompt-history"
api_version: 2
version: "1.2.0"
display_name: "Prompt History"
description: "Task panel listing the active session's user prompts with parity to the shipped core panel."
author: "kandev"
repo_url: "https://github.com/Fclem/kandev-plugin-prompt-history"
categories: ["tools"]

# min_kandev_version is the oldest kandev release this plugin will install
# against. A release host compares it to its own version at install time and
# refuses the package if it is older, so an operator gets a clear error instead
# of a plugin that loads and then fails on a missing API.
#
# 0.95.0 is the first stable release after PR #3588 added the browser
# conversation facade that ui/bundle.js calls through host.conversation. The
# messages capability audit floor is 0.91.1; this plugin needs the facade, so
# the facade release is the binding minimum.
min_kandev_version: "0.95.0"

# runtime.executables maps each supported platform to the binary kandev
# spawns as a gRPC subprocess. `make package` cross-compiles all five;
# `make package-host` builds just the current one. The paths are relative to
# the package root and must match what the Makefile writes into server/.
runtime:
  type: binary
  executables:
    linux-amd64: "server/plugin-linux-amd64"
    linux-arm64: "server/plugin-linux-arm64"
    darwin-amd64: "server/plugin-darwin-amd64"
    darwin-arm64: "server/plugin-darwin-arm64"
    windows-amd64: "server/plugin-windows-amd64.exe"

# capabilities gate what the host will do for you. Declare only what you use.
# This plugin reads the active session's conversation through the browser
# facade (api_read messages) and nothing else: the no-op backend needs no
# events, state, secrets, or write access. Reading its own operator config
# (config_schema below) goes through GET /api/plugins/<id>/config, which is not
# a capability-gated route.
capabilities:
  api_read: ["messages"]

# Operator display settings, rendered by the host at Settings > Plugins >
# Prompt History. Every field defaults to the panel's original appearance, so
# an instance whose config was never saved renders exactly as before. The panel
# reads the stored config from GET /api/plugins/<id>/config on mount and falls
# back to these defaults when the read fails; a saved change therefore applies
# the next time the panel mounts (session/task switch or reload). The key names
# and the date-format values are mirrored by PANEL_CONFIG_KEYS /
# PANEL_DATE_FORMATS in ui/src/panel-config.ts, and `go test ./server/...`
# fails if the two sides drift.
#
# `required` lists the two selectors — `display_2_time_format` and
# `display_5_agent_style`: an optional enum renders a "Not set" choice on the
# host's form, and neither setting has a meaningful third state (the panel has
# exactly two time formats, and every prompt is one of the three styles), so
# both are required — each select then always shows the stored value or its
# default and always submits one. The panel still reads an absent or unknown
# value as the default (`relative` / `normal`), which covers a hand-edited
# config and any record written before a field was required.
#
# The `N_` segment in each key is the field's position in the host's settings
# form. The form renders `Object.keys(properties)` in order, and the host hands
# the frontend a JSON object marshalled from a Go map — which sorts keys — so
# the declaration order below is *not* the render order and the key is the only
# ordering lever the manifest has. `display_1_…` renders first (send time),
# `display_2_…` second (its format), and so on.
config_schema:
  type: object
  properties:
    display_1_show_time:
      type: boolean
      default: true
      title: "Show prompt send time"
      description: "Show the send time (clock) at the right edge of each prompt row. Hidden send time and duration together let the prompt text use the full row width."
    display_2_time_format:
      type: string
      enum: ["relative", "absolute"]
      default: "relative"
      title: "Prompt time format"
      description: "How the send time reads: compact relative (\"5m\"), or the absolute date and time in the host locale (short date and short time). The other form is shown on hover."
    display_3_show_numbers:
      type: boolean
      default: true
      title: "Show prompt numbering"
      description: "Show the #N ordinal at the start of each prompt row."
    display_4_show_duration:
      type: boolean
      default: true
      title: "Show prompt duration"
      description: "Show the agent work duration (hourglass) at the right edge of each prompt row."
    display_5_agent_style:
      type: string
      enum: ["normal", "soft grey", "hide"]
      default: "normal"
      title: "Agent prompt style"
      description: "How prompts sent by another task's agent are shown: normal (the same bubble as other prompts), soft grey, or hidden entirely."
  required: ["display_2_time_format", "display_5_agent_style"]

# ui.bundle points at the ES module frontend half, built by ui/build.mjs into
# ui/bundle.js and served by kandev from the extracted package at
# GET /api/plugins/<id>/ui/bundle.js. ui.styles declares the plugin-owned
# stylesheet the bundle depends on; the host's build never sees the bundle, so
# the stylesheet owns every ph-plugin-* class it renders (the row bubble also
# reuses the host's global markdown-body / markdown-body-user classes).
ui:
  bundle: "/ui/bundle.js"
  styles: ["/ui/plugin.css"]
